<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Vault</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="system">
  <div id="container">
    <header class="app-header">
      <div class="brand">
        <img src="icon32.png" alt="" class="brand-mark" />
        <span class="brand-name">Social Vault</span>
      </div>
      <div class="header-actions">
        <select id="profileSwitcher" class="profile-switcher" aria-label="Active profile"></select>
        <button id="openSettings" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
      </div>
    </header>

    <div class="tabs segmented" role="tablist">
      <button class="tab-btn active" data-tab="social" role="tab">Links</button>
      <button class="tab-btn" data-tab="personal" role="tab">Details</button>
    </div>

    <section class="tab-content active" id="socialSection" role="tabpanel">
      <form id="addForm" class="stack">
        <input type="text" id="platform" placeholder="Platform (e.g. LinkedIn)" required />
        <input type="url" id="link" placeholder="URL" required />
        <div class="row">
          <button type="submit" class="primary-btn">Add link</button>
          <button type="button" id="cancelLinkEdit" class="ghost-btn hidden">Cancel</button>
        </div>
      </form>
      <ul id="linksList" class="link-list"></ul>
    </section>

    <section class="tab-content" id="personalSection" role="tabpanel">
      <div id="personalDetails"></div>
    </section>

    <footer class="footer-actions">
      <button id="shareProfile" class="secondary-btn">Share profile</button>
      <button id="showAnalytics" class="ghost-btn">Analytics</button>
    </footer>
  </div>

  <div id="profileCardModal" class="modal" hidden>
    <div class="modal-content">
      <header class="modal-header">
        <h3>Your profile card</h3>
        <button class="close-modal" aria-label="Close">&times;</button>
      </header>
      <div id="profileCard" class="profile-card"></div>
      <div class="row">
        <button id="copyProfileCard" class="primary-btn">Copy</button>
      </div>
    </div>
  </div>

  <div id="analyticsModal" class="modal" hidden>
    <div class="modal-content">
      <header class="modal-header">
        <h3>Analytics</h3>
        <button class="close-modal" aria-label="Close">&times;</button>
      </header>
      <div class="analytics-summary">
        <div class="stat-card">
          <span class="stat-label">Total clicks</span>
          <span id="totalClicks" class="stat-value">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Time saved</span>
          <span id="timeSaved" class="stat-value">0s</span>
        </div>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal" hidden>
    <div class="modal-content">
      <header class="modal-header">
        <h3>Settings</h3>
        <button class="close-modal" aria-label="Close">&times;</button>
      </header>

      <div class="settings-section">
        <h4>Theme</h4>
        <div class="segmented small" role="radiogroup" aria-label="Theme">
          <button class="tab-btn theme-btn" data-theme="light" role="radio">Light</button>
          <button class="tab-btn theme-btn" data-theme="dark" role="radio">Dark</button>
          <button class="tab-btn theme-btn" data-theme="system" role="radio">System</button>
        </div>
      </div>

      <div class="settings-section">
        <h4>Profiles</h4>
        <ul id="profileList" class="profile-list"></ul>
        <form id="newProfileForm" class="row">
          <input type="text" id="newProfileName" placeholder="New profile name" required />
          <button type="submit" class="primary-btn">Add</button>
        </form>
      </div>

      <div class="settings-section">
        <h4>Backup</h4>
        <div class="row">
          <button id="exportBtn" class="secondary-btn">Export JSON</button>
          <button id="importBtn" class="secondary-btn">Import JSON</button>
          <input type="file" id="importFile" accept="application/json" hidden />
        </div>
        <p class="hint">Data is stored in your Chrome sync storage. It moves with your Google account across devices.</p>
      </div>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
